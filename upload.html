<!DOCTYPE html>
<!-- Uploader has no security although is deliberately not linked from index.html this is 
designed as an internal network webapp -->
<!-- TODO style and script should be put in separate files either style.css script.js or there own files  -->
<!-- Also should check if this is already repeated there  -->
<html>

<head>
  <title>Upload Images</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
    }

    .upload-form {
      border: 2px dashed #ccc;
      padding: 20px;
      text-align: center;
    }

    .file-preview {
      margin: 20px 0;
      text-align: left;
    }

    .file-item {
      display: flex;
      align-items: center;
      margin: 10px 0;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 4px;
    }

    .file-item img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      margin-right: 15px;
      border-radius: 4px;
    }

    .file-details {
      flex-grow: 1;
    }

    .file-item input[type="text"] {
      padding: 5px;
      margin: 0 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      width: 200px;
    }

    .original-name {
      color: #666;
      font-size: 0.9em;
      margin-top: 4px;
    }

    .success-message {
      color: green;
      display: none;
      margin-top: 10px;
    }

    .upload-list {
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h1 style="margin: 0;">Upload Images</h1>
    <button onclick="window.location.href='index.html'" style="background-color: #666; color: white; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer;">← Back to Food Selection</button>
  </div>
  <div class="upload-form">
    <form id="uploadForm" enctype="multipart/form-data">
      <input type="file" id="imageInput" name="images" multiple accept="image/*">
      <div id="filePreview" class="file-preview"></div>
      <button type="submit">Upload Images</button>
    </form>
    <div id="successMessage" class="success-message">Upload successful!</div>
  </div>
  <div class="upload-list">
    <h2>Recently Uploaded:</h2>
    <ul id="fileList"></ul>
  </div>

  <script>
    // Work out the name a file will be saved as, from what was typed in the box
    function buildFileName(nameInput, file) {
      const typed = nameInput.value.trim();
      if (!typed) {
        return file.name;
      }
      const ext = nameInput.dataset.originalExtension;
      // Don't add a second extension if it was typed in
      if (ext && typed.toLowerCase().endsWith(ext.toLowerCase())) {
        return typed;
      }
      return typed + ext;
    }

    // Handle file selection and preview
    document.getElementById('imageInput').onchange = function () {
      const preview = document.getElementById('filePreview');
      preview.innerHTML = '';

      Array.from(this.files).forEach((file, index) => {
        const fileItem = document.createElement('div');
        fileItem.className = 'file-item';

        // Create image preview
        const img = document.createElement('img');
        img.src = URL.createObjectURL(file);

        // Create file details div
        const details = document.createElement('div');
        details.className = 'file-details';

        // Create rename input
        const nameInput = document.createElement('input');
        nameInput.type = 'text';
        nameInput.value = file.name.split('.')[0]; // Default to original filename without extension
        nameInput.dataset.originalExtension = '.' + file.name.split('.').pop();
        nameInput.placeholder = 'Enter new filename';

        // Show original filename
        const originalName = document.createElement('div');
        originalName.className = 'original-name';
        originalName.textContent = `Original: ${file.name}`;

        // Update the saved name display when the input changes
        nameInput.addEventListener('input', function () {
          if (this.value.trim() === '') {
            originalName.textContent = `Original: ${file.name}`;
          } else {
            originalName.textContent = `Will be saved as: ${buildFileName(this, file)}`;
          }
        });

        details.appendChild(nameInput);
        details.appendChild(originalName);

        fileItem.appendChild(img);
        fileItem.appendChild(details);
        preview.appendChild(fileItem);
      });
    };

    document.getElementById('uploadForm').onsubmit = async (e) => {
      e.preventDefault();
      const formData = new FormData();
      const fileInputs = document.querySelectorAll('.file-item input[type="text"]');
      const files = document.getElementById('imageInput').files;

      // Collect the new names in the same order as the files
      const newNames = [];
      Array.from(files).forEach((file, index) => {
        const newName = buildFileName(fileInputs[index], file);
        const renamedFile = new File([file], newName, {type: file.type});
        formData.append('images', renamedFile);
        newNames.push(newName);
      });

      // Names go as a single field so repeated form fields are not collapsed
      formData.append('names', JSON.stringify(newNames));

      try {
        const response = await fetch('/upload', {
          method: 'POST',
          body: formData
        });
        const result = await response.json();

        if (result.success) {
          const successMsg = document.getElementById('successMessage');
          successMsg.textContent = `Upload successful!${result.files.join(', ')}`;
          successMsg.style.display = 'block';
          setTimeout(() => {
            successMsg.style.display = 'none';
          }, 3000);

          // Clear the input and preview
          document.getElementById('uploadForm').reset();
          document.getElementById('filePreview').innerHTML = '';

          // Refresh the file list
          loadRecentFiles();
        } else {
          const rejected = (result.rejected || []).join(', ');
          alert('Upload failed.' + (rejected ? ` Not saved: ${rejected}` : '') + (result.message ? ` ${result.message}` : ''));
        }
      } catch (error) {
        console.error('Upload failed:', error);
        alert('Upload failed. Please try again.');
      }
    };

    async function loadRecentFiles() {
      try {
        const response = await fetch('/list-images');
        const images = await response.json();
        const fileList = document.getElementById('fileList');
        fileList.innerHTML = '';

        images.forEach(image => {
          const li = document.createElement('li');
          li.textContent = image.path;
          fileList.appendChild(li);
        });
      } catch (error) {
        console.error('Error loading file list:', error);
      }
    }

    // Load the file list when the page loads
    loadRecentFiles();
  </script>
</body>

</html>
